<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kukljica EcoOasis</title>
<meta name="description" content="A seven hectare ecosystem restoration site on the island of Ugljan, Croatia.">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="img/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="theme-color" content="#0D1117">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap&subset=latin,latin-ext" rel="stylesheet">
<style>
:root{
  --bg:#0d1117; --surface:#151b23; --line:#232c37;
  --text:#e6edf3; --muted:#8b949e;
  --olive:#7d8f4f; --myrtle:#2f5d50; --adriatic:#2aa198;
  --limestone:#d9d2c5; --ochre:#c8892f;
  --display:'Fraunces',Georgia,serif;
  --body:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --maxw:1180px;
}
html[data-mode="day"]{
  --bg:#f4f2ed; --surface:#e9e5db; --line:#d2ccbe;
  --text:#1a1f26; --muted:#5c6672;
  --limestone:#3a3222;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;overflow-x:hidden;max-width:100vw;background:var(--bg);color:var(--text);font-family:var(--body);font-weight:300;line-height:1.65;font-size:17px;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--adriatic);text-decoration:none;border-bottom:1px solid rgba(42,161,152,.35)}
a:hover{border-bottom-color:var(--adriatic)}
:focus-visible{outline:2px solid var(--adriatic);outline-offset:3px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px;width:100%}

/* ---------- nav ---------- */
nav{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.navin{max-width:var(--maxw);margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.mark{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--text);border:0;white-space:nowrap;display:flex;align-items:center;gap:9px}
.mark img{flex:0 0 auto}
.mark b{color:var(--olive);font-weight:500}
.navlinks{display:flex;gap:18px;margin-left:auto;flex-wrap:wrap}
.navlinks a{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:0}
.navlinks a:hover{color:var(--text)}
.toggles{display:flex;gap:8px;margin-left:6px}
.tg{font-family:var(--mono);font-size:11px;letter-spacing:.1em;background:none;border:1px solid var(--line);color:var(--muted);padding:5px 9px;cursor:pointer;border-radius:2px}
.tg:hover{color:var(--text);border-color:var(--muted)}
.tg b{color:var(--adriatic);font-weight:500}
@media(max-width:860px){.navlinks{display:none}}

/* ---------- hero ---------- */
header.hero{position:relative;border-bottom:1px solid var(--line);overflow:hidden}
.heroimg{position:absolute;inset:0}
.heroimg img{width:100%;height:100%;object-fit:cover;opacity:.55}
.heroveil{position:absolute;inset:0;background:linear-gradient(180deg,var(--bg) 0%,rgba(13,17,23,.35) 45%,var(--bg) 100%)}
html[data-mode="day"] .heroveil{background:linear-gradient(180deg,var(--bg) 0%,rgba(244,242,237,.3) 45%,var(--bg) 100%)}
.heroin{position:relative;max-width:var(--maxw);margin:0 auto;padding:110px 24px 70px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--olive);margin-bottom:26px}
h1{font-family:var(--display);font-weight:300;font-size:clamp(2.9rem,8vw,5.6rem);line-height:.98;margin:0 0 8px;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--olive)}
.lede{font-family:var(--display);font-weight:300;font-size:clamp(1.15rem,2.5vw,1.55rem);line-height:1.45;max-width:30ch;margin:26px 0 34px;color:var(--text)}
.ctas{display:flex;gap:12px;flex-wrap:wrap}
.herocredit{margin-top:34px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.herocredit a{color:var(--muted);border:0}
.herocredit a:hover{color:var(--adriatic)}
.btn{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:13px 22px;border:1px solid var(--olive);color:var(--olive);border-radius:2px}
.btn.solid{background:var(--olive);color:var(--bg);border-color:var(--olive)}
html[data-mode="day"] .btn.solid{color:#fff}
.btn:hover{background:var(--olive);color:var(--bg)}
html[data-mode="day"] .btn:hover{color:#fff}

/* parcel outline */
.parcel{position:absolute;right:5%;top:50%;transform:translateY(-50%);width:min(320px,32vw);opacity:.5;pointer-events:none}
.parcel path{fill:none;stroke:var(--olive);stroke-width:1.5;stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 3.4s ease forwards .5s}
@keyframes draw{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.parcel path{animation:none;stroke-dashoffset:0}}
@media(max-width:860px){.parcel{display:none}}

/* ---------- numbers ---------- */
.figs{border-bottom:1px solid var(--line);background:var(--surface)}
.figgrid{max-width:var(--maxw);margin:0 auto;padding:0 24px;display:grid;grid-template-columns:repeat(6,1fr)}
.fig{padding:26px 14px 26px 0}
.fig .n{font-family:var(--display);font-size:1.75rem;line-height:1;color:var(--adriatic)}
.fig .l{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:8px}
@media(max-width:880px){.figgrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:480px){.figgrid{grid-template-columns:repeat(2,1fr)}}

/* ---------- sections ---------- */
section{padding:84px 0;border-bottom:1px solid var(--line)}
.slab{height:9px;width:100%;background:repeating-linear-gradient(90deg,var(--line) 0 22px,transparent 22px 25px,var(--line) 25px 40px,transparent 40px 44px,var(--line) 44px 71px,transparent 71px 75px);opacity:.55;margin-bottom:54px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--olive);margin-bottom:18px}
h2{font-family:var(--display);font-weight:300;font-size:clamp(1.9rem,4.4vw,3rem);line-height:1.08;margin:0 0 24px;letter-spacing:-.015em;max-width:20ch}
h3{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0 0 10px;line-height:1.25}
p{max-width:68ch;margin:0 0 20px;overflow-wrap:break-word}
.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:54px;align-items:start}
.two>*{min-width:0}
@media(max-width:900px){.two{grid-template-columns:1fr;gap:34px}}
figure{margin:0}
figcaption{overflow-wrap:anywhere;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted);margin-top:10px;line-height:1.5}
.quotefig{margin:26px 0 10px;font-size:clamp(1.05rem,2.2vw,1.3rem);max-width:none}
.byline{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted);padding-left:26px;margin-bottom:6px}
.pull{font-family:var(--display);font-weight:300;font-size:clamp(1.25rem,3vw,1.85rem);line-height:1.35;color:var(--limestone);border-left:2px solid var(--olive);padding-left:24px;margin:40px 0;max-width:34ch}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:34px}
.card{background:var(--bg);padding:26px 22px}
.card .tag{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--olive);margin-bottom:12px}
.card p{font-size:15px;margin:0 0 12px}
.card .out{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em;line-height:1.5}

/* species */
.species{display:flex;flex-wrap:wrap;gap:7px;margin:26px 0 0;padding:0;list-style:none}
.species li{font-family:var(--mono);font-size:11px;letter-spacing:.05em;border:1px solid var(--line);padding:6px 10px;color:var(--muted);border-radius:2px}
.species li.new{border-color:var(--olive);color:var(--olive)}
.species li.out{border-color:var(--ochre);color:var(--ochre);text-decoration:line-through}

/* calendar ring */
.calwrap{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:54px;align-items:center;margin-top:20px}
@media(max-width:900px){.calwrap{grid-template-columns:minmax(0,1fr);gap:34px}}
#ring{width:100%;max-width:100%;height:auto;display:block}
#ring .sector{cursor:pointer;fill:transparent;stroke:var(--line);stroke-width:1;transition:fill .18s}
#ring .sector:hover{fill:rgba(125,143,79,.16)}
#ring .sector.on{fill:rgba(125,143,79,.34);stroke:var(--olive)}
#ring .slabarc{fill:none;stroke:var(--line);stroke-width:1;opacity:.6}
#ring text{font-family:var(--mono);font-size:11px;fill:var(--muted);pointer-events:none}
#ring .on + text{fill:var(--text)}
.calpanel .mo{font-family:var(--display);font-size:2.3rem;line-height:1;color:var(--adriatic);margin-bottom:20px}
.calrow{border-top:1px solid var(--line);padding:14px 0;display:grid;grid-template-columns:112px minmax(0,1fr);gap:16px}
.calrow .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--olive);padding-top:3px}
.calrow .v{font-size:15px}
@media(max-width:520px){.calrow{grid-template-columns:1fr;gap:4px}}

/* bunja drawing */
.bunja{width:100%;max-width:min(420px,100%);height:auto}
.bunja .stone{fill:none;stroke:var(--limestone);stroke-width:1.1;opacity:.85}
.bunja .dim{stroke:var(--adriatic);stroke-width:.8;fill:none}
.bunja text{font-family:var(--mono);font-size:9px;fill:var(--adriatic)}
.bunja .ground{stroke:var(--olive);stroke-width:1.2}

/* lists */
.plain{list-style:none;padding:0;margin:24px 0 0}
.plain li{border-top:1px solid var(--line);padding:15px 0;display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;font-size:15px;overflow-wrap:anywhere}
.plain li b{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--olive);font-weight:500;padding-top:3px}
@media(max-width:560px){.plain li{grid-template-columns:1fr;gap:5px}}

/* timeline */
.phase{border-left:1px solid var(--line);padding:0 0 30px 26px;position:relative}
.phase:before{content:"";position:absolute;left:-4.5px;top:7px;width:8px;height:8px;background:var(--bg);border:1px solid var(--muted);border-radius:50%}
.phase.now:before{background:var(--olive);border-color:var(--olive)}
.phase .ph{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.phase.now .ph{color:var(--olive)}
.phase p{font-size:15px;margin:0}

/* growing */
.areabar{width:100%;height:auto;margin:22px 0 8px}
.areabar text{font-family:var(--mono);font-size:15px}
ol.steps{counter-reset:st;list-style:none;padding:0;margin:26px 0}
ol.steps li{counter-increment:st;position:relative;padding:14px 0 14px 54px;border-top:1px solid var(--line);font-size:15px}
ol.steps li:before{content:counter(st,decimal-leading-zero);position:absolute;left:0;top:15px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--olive)}
ol.steps li b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:26px;margin:34px 0}
.gal figure{margin:0}
.gal.real img{width:100%;aspect-ratio:4/3;object-fit:cover}

/* nutrition matrix */
.matrix{display:grid;grid-template-columns:118px minmax(0,1fr) minmax(0,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:30px 0}
.mcell{background:var(--bg);padding:16px 14px;font-size:14.5px}
.mcell.head{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--olive);display:flex;align-items:center}
.mcell b{display:block;font-family:var(--display);font-weight:400;font-size:1.08rem;margin-bottom:5px}
.mcell span{color:var(--muted);font-size:13.5px;line-height:1.5}
@media(max-width:620px){.matrix{grid-template-columns:88px minmax(0,1fr) minmax(0,1fr)}.mcell{padding:12px 10px}}

/* four trees */
.tree{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:38px;align-items:center;padding:34px 0;border-top:1px solid var(--line)}
.tree:nth-child(even) .treetext{order:-1}
.tree .el{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--adriatic);margin-bottom:10px}
.tree h3{margin-bottom:4px}
.tree .lat{font-family:var(--mono);font-size:11px;color:var(--muted);font-style:normal;margin-bottom:14px}
.tree p{font-size:15px;margin:0}
@media(max-width:760px){.tree{grid-template-columns:minmax(0,1fr);gap:18px}.tree:nth-child(even) .treetext{order:0}}

/* portraits */
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-top:30px}
.pgrid img{border:1px solid var(--line);filter:saturate(.9)}

/* influences */
.inf{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:26px 40px;margin-top:34px}
.inf div{border-top:1px solid var(--line);padding-top:16px}
.inf h4{font-family:var(--display);font-weight:400;font-size:1.05rem;margin:0 0 6px}
.inf p{font-size:14px;color:var(--muted);margin:0}

/* ---------- owner's manual ---------- */
.owkpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:34px 0 10px}
.owkpi div{background:var(--bg);padding:18px 16px}
.owkpi .n{font-family:var(--display);font-size:1.6rem;line-height:1.05;color:var(--text)}
.owkpi .l{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:8px;line-height:1.45}
@media(max-width:620px){.owkpi{grid-template-columns:repeat(2,minmax(0,1fr))}}
.owh{margin-top:64px}
.owsub{font-size:15px;color:var(--muted)}
.owmapwrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);gap:34px;align-items:start;margin-top:22px}
@media(max-width:900px){.owmapwrap{grid-template-columns:minmax(0,1fr)}}
#owmap{width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--line);touch-action:manipulation}
#owmap .cx{fill:none;stroke:var(--line);stroke-width:.8}
#owmap .mu{fill:url(#owhatch);stroke:var(--muted);stroke-width:.8}
#owmap .pp{stroke:var(--bg);stroke-width:1.4;cursor:pointer;transition:fill .15s}
#owmap .pp.k1{fill:rgba(42,161,152,.28)} #owmap .pp.k2{fill:rgba(42,161,152,.55)} #owmap .pp.k3{fill:rgba(42,161,152,.88)}
#owmap .pp.core{stroke:var(--olive);stroke-width:2.2}
#owmap .pp.check{stroke:var(--olive);stroke-width:2;stroke-dasharray:4 3}
#owmap .pp.sel{fill:var(--ochre)}
#owmap .pp.dim{fill-opacity:.35}
#owmap .pp:hover{stroke:var(--text);stroke-width:2}
#owmap text{font-family:var(--mono);font-size:8.5px;fill:var(--text);pointer-events:none;paint-order:stroke;stroke:var(--surface);stroke-width:2.5px}
.owleg{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.owleg span{display:inline-flex;align-items:center;gap:6px}
.owleg i{display:inline-block;width:14px;height:10px;border-radius:2px}
.owpanel{border:1px solid var(--line);padding:18px 18px 8px;font-size:14.5px;min-height:140px}
.owpanel .t{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--olive);margin-bottom:8px}
.owpanel h4{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0 0 6px}
.owpanel ul{list-style:none;padding:0;margin:10px 0}
.owpanel li{border-top:1px solid var(--line);padding:8px 0;font-size:14px}
.owpanel li b{font-family:var(--mono);font-weight:500;font-size:11px;color:var(--muted)}
.owpanel .x{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.owtabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px}
.owtabs button{font-family:var(--mono);font-size:11px;letter-spacing:.08em;background:none;border:1px solid var(--line);color:var(--muted);padding:6px 11px;border-radius:2px;cursor:pointer}
.owtabs button.on{border-color:var(--adriatic);color:var(--text)}
.owbars{margin-top:14px}
.owbar{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr) 8.5rem;gap:14px;align-items:center;padding:7px 4px;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.owbar:hover,.owbar.on{background:var(--surface)}
.owbar .nm{overflow-wrap:anywhere;line-height:1.35}
.owbar .nm small{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.03em}
.owbar .tr{height:12px;position:relative}
.owbar .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--adriatic);border-radius:0 4px 4px 0;min-width:2px}
.owbar.on .tr i{background:var(--ochre)}
.owbar .tr i.unk{background:repeating-linear-gradient(45deg,var(--muted) 0 2px,transparent 2px 5px)}
.owbar .v{font-family:var(--mono);font-size:12px;text-align:right;color:var(--text)}
.owbar .v small{display:block;font-size:10px;color:var(--muted)}
@media(max-width:620px){.owbar{grid-template-columns:minmax(0,1fr) 6.5rem}.owbar .tr{grid-column:1 / -1;grid-row:2}}
.owtwo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:54px;margin-top:10px}
@media(max-width:900px){.owtwo{grid-template-columns:minmax(0,1fr);gap:20px}}
.owbar.st{grid-template-columns:7.5rem minmax(0,1fr) 7.5rem;cursor:default}
.owbar.st:hover{background:none}
.owtbl{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:16px}
.owtbl th{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--olive);font-weight:500;text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.owtbl th[data-k]{cursor:pointer}
.owtbl td{padding:9px 8px;border-top:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.owtbl td.r,.owtbl th.r{text-align:right;font-family:var(--mono);white-space:nowrap}
.owtbl tr.hl td{background:var(--surface)}
.owtbl .x{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.owscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);margin-top:12px}
.owscroll .owtbl{margin:0;min-width:640px}
.owtools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.owtools input{font-family:var(--mono);font-size:12px;background:var(--bg);color:var(--text);border:1px solid var(--line);padding:8px 10px;border-radius:2px;min-width:0;flex:1 1 220px;max-width:340px}
.owtools button{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:none;border:1px solid var(--olive);color:var(--olive);padding:8px 12px;border-radius:2px;cursor:pointer}
.owtools button:hover{background:var(--olive);color:var(--bg)}
.owtip{position:fixed;z-index:80;pointer-events:none;background:var(--surface);border:1px solid var(--line);padding:9px 11px;font-size:13px;max-width:280px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;line-height:1.45}
.owtip b{font-family:var(--mono);font-weight:500}
.owtip .x{font-family:var(--mono);font-size:10.5px;color:var(--muted)}

footer{padding:56px 0 40px;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.05em;line-height:1.9}
.ver{position:fixed;right:10px;bottom:8px;font-family:var(--mono);font-size:9.5px;color:var(--muted);opacity:.55;z-index:60}
.note{overflow-wrap:anywhere;font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);padding:14px 16px;margin-top:26px;line-height:1.7;max-width:70ch}
</style>
</head>

<nav>

const T = {
en:{
"credit.kacan":"Aerial photographs by Boris Kačan · boriskacan.com · used with permission",
"land.cap2":"The headland and the tombolo that joins it to the rest of the land. The pale line is the beach path.",
"hist.cap":"Aleppo pine canopy on the parcel. Dense, even and almost unbroken, with the old terrace lines still readable beneath it.",
"water.cap2":"The shallows on the west side. The dark patches are seagrass, and the pale rim is limestone that holds no water at all.",
"craft.cap2":"The stone rim of the shore. Every wall on the parcel was built from this, gathered by hand where it lay.",
"live.cap2":"The few houses at the shore. This is the whole of the built landscape here, and it is meant to stay that way.",
"nav.trees":"Four trees",
"tr.kicker":"Four trees",
"tr.h":"Four trees, four forces on the same ground",
"tr.p":"These four carry the project. Not because they are the only species going in, but because each one solves a different problem that this land sets, and between them they cover the whole of it. Every one of them was growing here long before anyone wrote anything down.",
"tr.fifth":"The fifth is not a tree. It is the bee, which visits all four and holds the year together, and it is the reason the calendar on this site exists at all.",
"phil.kicker":"Why indigenous",
"phil.h":"We grow forward out of what was already here",
"phil.p1":"There is a way of farming that needs constant support. You bring in a species that did not evolve here, and then you spend the rest of your life defending it. Water it, feed it, spray it, replace it. The plant never settles, the soil never builds, and the work never ends. That is not agriculture, it is life support.",
"phil.pull":"When an old olive sends a shoot up from its stump, it is not a new tree. It is a new expression of the same genotype.",
"phil.p2":"An indigenous species asks for none of that. It has spent thousands of years being selected by exactly this rainfall, this thin soil, this wind and these pests. It knows the summer is coming. Everything it needs is already written into it. You plant it, you protect it for two or three years, and then it takes over its own life.",
"phil.p3":"That is why the olive is the mark of this project. In its natural state an olive never really dies of age. When the trunk goes hollow or burns or is cut, shoots rise from the stump and the tree continues, the same individual carrying on under a new shape. That is the whole argument in one plant: you do not start again from nothing, you grow forward out of what was already here.",
"phil.p4":"Sadhana Forest showed this on the other side of the world. In 2003 Aviram and Yorit Rozin sold their house in Israel and moved with their baby daughter onto seventy acres of eroded, barren ground outside Auroville, to bring back the Tropical Dry Evergreen Forest, of which less than one hundredth of a percent still stands. Nothing was watered permanently. They worked the water first, slowing it, spreading it, sinking it into the ground instead of letting the monsoon run straight off bare land into the sea. Then they planted indigenous species and nothing else, tens of thousands of them across a hundred and sixty species.",
"phil.p5":"The thing worth repeating is what happened next. The forest began planting itself. Birds and animals came back, carried seed, and now for every tree that gets planted by hand the forest raises several of its own. That is what an ecosystem does once you stop fighting it and give it back its own species. It stops being a project and becomes a place. That is what we are after here, on seven hectares of Croatian karst, with olive and almond and fig and holm oak instead of tropical dry evergreen, and with the same simple discipline: water first, indigenous species only, and enough patience to let the land do most of the work.",
"tr.pairh":"They also work in two pairs",
"tr.pairp":"Look at what comes off these four trees and they sort themselves twice over. Two of them give fat, which is dense, slow energy that keeps. Two give carbohydrate, which is quick energy. And crossing that, two of them have to be worked before a human can eat them at all, while two only need to be dried.",
"tr.mfat":"Fat","tr.mcarb":"Carbohydrate",
"tr.mwork":"Needs work","tr.mdry":"Needs only drying",
"tr.molive":"Olive","tr.moliveD":"Bitter and inedible off the tree. Cured or pressed. Oil keeps a year in a dark jar.",
"tr.moak":"Holm oak","tr.moakD":"Tannins leached out, then ground to flour and baked. Acorn bread has been made on Mediterranean islands since the Palaeolithic.",
"tr.malmond":"Almond","tr.malmondD":"Roughly half fat. Left in the shell it keeps through to the next harvest with no work at all.",
"tr.mfig":"Fig","tr.mfigD":"Dried on a rack in the sun. Sugar concentrates, and a good year feeds you until the next one.",
"tr.pairp2":"That second axis is not a footnote. The two foods that need work are the two that were most valued, because the labour was the storage. In Sardinia, acorn bread sold for more than wheat bread precisely because it was harder to make, and the women who made it were known for it. The Latin name of the holm oak, ilex, is thought to come from eligo, to choose. It was the tree that got chosen.",
"tr.honest":"Honest limit: these four give fat and carbohydrate, not a complete diet. Protein comes from the chickpea in the terraces, and historically from the sea and from sheep. Nobody here ever lived on trees alone.",
"bun.real.h":"Real bunje, Brač, May 2014",
"bun.real.p":"These are photographs, mine, taken on Brač on 27 May 2014. Bunje restored and still in use: a stone terrace, agaves in pots, olives all around, and on two of them a solar panel laid on the slab roof.",
"bun.r1":"A bunja among the olives, Brač.","bun.r2":"Two bunje on a slope above the sea.","bun.r3":"A restored bunja with a stone terrace and agaves.",
"bun.r4":"A solar panel on a roof of stone slabs: the oldest building of the coast carrying new power.","bun.r5":"A narrow door, a panel above it, nothing else needed.","bun.r6":"Stone steps up to the bunja.",
"gg.kicker":"Child project","gg.h":"Green and Go Croatian Islands",
"gg.p1":"Electric scooters for rent on the Croatian islands, run out of renovated shipping containers: one container on every island a car can reach, in the season. It grew out of this land and starts here, on Ugljan, in Kukljica, where we know the ground and the people.",
"gg.p2":"The two ideas meet in the sun. A bunja with a panel on its roof can charge what moves quietly on the island, the way the solar bunja on Brač already does.",
"gg.c":"A bunja with a solar panel, Brač, May 2014. Photo: Marko Boško.","gg.link":"Green and Go Croatian Islands, the project page →",
"bun.h":"The bunja",
"bun.p1":"A bunja is the round dry stone field hut of the Croatian coast. The same building appears the length of the Adriatic under different names: kažun in Istria, trim on Hvar, komarda on Krk, vrtujak and toreta on Korčula, and ćemer, poljarica, pudarica or kućarica depending on which village you ask. Typically three to four metres across, with walls up to eighty centimetres thick.",
"bun.p2":"It is built entirely of stone, with no mortar and no timber. The wall goes up in circular courses, then the builder begins stepping each ring of flat slabs slightly further inward than the one below until the rings close overhead. That is a false vault, and it holds by weight and friction alone. A single round stone caps the apex.",
"bun.p3":"What makes it belong here is where the stone comes from. On karst you cannot farm until you clear the rock, and the cleared rock has to go somewhere. It went into the terrace walls, and what was left over went into the hut. One of these takes roughly thirty cubic metres of stone. The building is not placed on the field, it is what the field gave up in order to become a field.",
"bun.p4":"Their great period was the 18th and 19th centuries, when a growing population pushed new olive groves and vineyards onto ever stonier ground. They gave shade in the working day and shelter in a storm, and before the harvest people slept in them to guard the crop. Shepherds used them. In the villages the same shape became a pigsty or a donkey stable. Many were later broken up for building material, which is the ordinary way this kind of heritage disappears.",
"bun.c1":"A single bunja in an old olive grove. One window, one low door, everything else stone.",
"bun.c2":"Inside. Thick wall, deep window, two niches, and the corbelled dome closing to a small opening at the top.",
"bun.c3":"The roof from below. Flat slabs laid in rings, each stepping inward, held by weight and friction alone.",
"bun.c4":"Two of them on a coastal slope. The smaller has no window and stores tools, the larger is for shelter.",
"bun.c5":"Part way up. The stone is sorted by size on the ground first, which is most of the work.",
"bun.c6":"Dry stone wall. The same craft, the same stone, laid flat instead of curved.",
"bun.note":"These six images are visualisations of the building type, made for this site. They are not photographs of existing buildings and not photographs of this parcel.",
"nav.growing":"Growing food",
"gr.kicker":"Growing food",
"gr.appk":"App · Three crops","gr.appp":"Cereal, pulse and oil: choose your three, narrow them like a tree, and see on a world climate map where they grow together on rain alone.","gr.appl":"Open the three crops app →",
"gr.h":"One day a month, and the food is done",
"gr.p1":"There is a documented Mediterranean smallholding that feeds one person completely from 740 square metres, on an average of one working day per month, with no synthetic fertiliser, no herbicide and no pesticide. It has run that way since 2013 and it has been measured and published in a peer reviewed journal. Its owner holds a full time job elsewhere.",
"gr.p2":"We are setting it out here because it answers the question everybody asks about a project like this, which is whether the food side is realistic or romantic. It is realistic, and the reason is the choice of crops. The staples are winter cereal for carbohydrate, winter pulse for protein and olive oil for fat, and all three were picked because they are indigenous, which is why they need no chemicals in the first place.",
"gr.f1":"m² feeds one person","gr.f2":"work day per month","gr.f3":"of the area unirrigated","gr.f4":"synthetic inputs","gr.f5":"kg olive oil a year","gr.f6":"years of refinement",
"gr.areah":"Where the area goes",
"gr.areap":"The proportions are the whole argument. The vegetable garden is under a fifth of the ground, takes about half of the total labour, uses every drop of the irrigation water, and returns roughly fifteen per cent of the calories. The grain, pulse, oil and sugar occupy the rest, run on rainfall alone, and carry the diet.",
"gr.s1h":"The vegetable garden, one quarter each month",
"gr.s1p":"The garden is split into four beds of about 35 square metres. Every month one bed gets rebuilt from scratch, always the one holding the oldest crop, so the four are permanently at four different stages and there is always a mature bed to eat from. The whole cycle below takes about four hours.",
"gr.c1":"Four beds at four stages. One rebuilt, one just planted, one half grown, one ready to cut.",
"gr.s1n":"Rebuilding happens in months 9, 10, 11 and 2 for the winter crops and 3, 4, 5 and 6 for the summer ones. Nothing is planted in months 12 and 1 because it is too cold to move, or in 7 and 8 because it is too hot.",
"gr.s2h":"Grain and pulse, four days for the whole year",
"gr.s2p":"Wheat and fava beans are sown together in month 12 and harvested together in month 5. Between those two dates the plot is not touched at all. No compost has gone onto it in twelve years.",
"gr.c2":"Wheat and fava standing ready. They ripen at different times but are cut and threshed as one job.",
"gr.s2n":"Cut the stalks, never pull them up. Uprooted plants bring soil and small stones into the threshing, and those are too heavy for the winnowing blower to remove, so they end up in the grain.",
"gr.s3h":"Olive oil, two days in month 11",
"gr.s3p":"Nine mid sized trees give about 200 kg of olives, which press out to 40 to 50 kg of oil. That is roughly twice what one person uses in a year, and the surplus is what you give away. Two mature trees would cover one person.",
"gr.c3":"Sheets spread under the tree. The whole harvest is one day for nine trees.",
"gr.s4h":"Sugar, one day in month 8",
"gr.s4p":"Carob is the sugar. It is native, it has been on this coast for millennia, it grows wild, and it needs nothing from anyone. One day of work in the hottest month of the year makes the sweetener for the whole year.",
"gr.c4":"Carob pods, the reduction, and the year's sugar in jars.",
"gr.s4n":"Stop the reduction well before it looks right. Syrup thickens a great deal as it cools, and taken to the consistency you actually want while hot, it sets into candy.",
"gr.pesth":"Pests, and why the indigenous crops do not get them",
"gr.pestp":"The wheat, the fava, the olives and the carob are barely troubled, because they are local and have not been bred far from what they were. The trouble is almost entirely in the vegetable garden, where many of the species are not from here. That is the same argument this whole project rests on, arriving from the direction of the plate.",
"gr.lessonh":"What we take from it",
"gr.lessonp":"Almost all of it transfers. Kukljica has the same climate, the same rainfall pattern, the same four staples and the same problem of thin soil over limestone. The differences are that our ground is steeper and stonier, which means terraces before beds, and that we have no water at all on site, which moves the whole water question in front of the whole food question. The order of work is not a preference here. It is the only order that can work.",
"gr.source":"Source: Pelman, Nachtomy and Carmel, Individual nutritional self-sufficiency, a viable option in the present era, Frontiers in Sustainable Food Systems, 2024. Figures are from the published study of Alik Pelman's farm. The images on this page are visualisations made for this site, not photographs of that farm or of this parcel.",

"land.kicker":"The land",
"land.h":"Four parcels above two bays",
"land.p1":"The site lies in Bačina uvala, below the Čelinjak ridge on the island of Ugljan, twenty minutes by ferry from Zadar. Cadastral parcels 2448/6, 2448/14, 2448/13 and 2449/1, measured at 7,02 hectares with 1,11 km of perimeter.",
"land.p2":"It carries old olive terraces in recoverable condition, dry stone walls, maquis, and a spreading cover of Aleppo pine. Most of the olives need pruning rather than replanting. There is no reliable surface water and no well yet; family memory places a spring on the land, still to be located.",
"land.legend":"GREEN = growing here now and staying · ORANGE = being removed · OLIVE OUTLINE = to be planted",
"land.cap":"ARKOD measurement of the parcel. Perimeter 1,11 km, area 7,02 ha, with individual section lengths.",

"hist.kicker":"What happened here",
"hist.h":"The forest that belongs here was cut for ships",
"hist.p1":"The eastern Adriatic islands were originally covered by evergreen holm oak forest, Quercus ilex, with hop hornbeam, wild pistachio, myrtle, strawberry tree and laurel beneath it. Maquis, garrigue and bare rocky pasture are its degradation stages, not its natural state.",
"hist.p2":"Clearing ran for centuries and had many causes: shipbuilding timber, including the Venetian Republic's long extraction of oak from Dalmatia, along with firewood, lime burning, goat and sheep grazing that stopped regrowth, and clearing for vineyards and olives that intensified through the 19th century. The first photographs of this coast show a nearly treeless landscape.",
"hist.pull":"What was planted in its place was chosen for speed, not for the place.",
"hist.p3":"Soil loss followed, and afforestation programmes intensified from the late 19th century under Austro-Hungarian administration. Aleppo pine, Pinus halepensis, was the species chosen, because it tolerates drought and colonises degraded ground. The stated intention was to build soil so that holm oak could return. That has largely not happened. Aleppo pine now self-seeds aggressively, dominates the littoral landscape, suppresses the flora beneath it and carries very high fire risk. We are removing the fast species and returning the slow ones, on seven hectares, so that at least one stretch of this coast shows what the island actually is.",

"meth.kicker":"Method",
"meth.h":"Five workstreams, each with something you can count",
"meth.p":"The model is Sadhana Forest, founded in 2003 near Auroville by Aviram and Yorit Rozin, which turned seventy acres of eroded ground into indigenous forest using volunteers, water retention earthworks and native species alone. They publish their survival rates. So will we, including the seasons that go badly.",
"meth.sketchh":"Pruning is the first intervention",
"meth.sketchp":"Most of the olives here are not dead, they are overgrown. The method is to cut the lateral shoots from the root, keep one main stem or two to three where they are already well developed, and open the crown so light and air get through. Restoration by pruning costs nothing but hands and returns a grove that is already forty or a hundred years old. Planting a new tree buys you a decade of waiting instead.",
"meth.sketchcap":"Working sketch. Lateral shoots crossed out, two to three main stems kept, figure for scale.",
"meth.note":"Nothing on this site is marked as done that is not done. The project is at Phase 0.",

"water.kicker":"Water",
"water.h":"A spring still to be found, and a great deal of dew",
"water.p1":"Water is the hardest problem on this site and it is treated first, before any planting. Nothing is watered permanently. Irrigation exists only to establish young trees and then it stops.",
"water.p2":"The lichen and moss on the lower ground indicate very high dew, which is a resource rather than a curiosity. Groundwater drains from the Čelinjak ridge down into Bačina uvala, and any source close to the shore has to be checked for salt intrusion before it is used.",
"water.cap":"Čelinjak ridge, V. vrh at 122,8 m, and the drainage down into Bačina uvala.",

"cal.kicker":"The calendar",
"cal.h":"The year decides the work, not the plan",
"cal.p":"A Mediterranean site is run by phenology. What is flowering tells you what the bees are on, what can be cut, what can be distilled and what has to wait. This ring is the working calendar. It is also the honest answer to the question of when to come and what you would actually be doing.",
"cal.k1":"In flower","cal.k2":"Bee forage","cal.k3":"Work",
"cal.note":"This calendar is provisional, built from regional phenology and the project document. It will be corrected by observation on the site itself, and the corrections will be published.",

"food.kicker":"Food forest",
"food.h":"Trees that do not need watering",
"food.p1":"Everything planted has to survive a Dalmatian summer without irrigation once established. That rules out most of what a garden centre sells and rules in what people here grew for centuries.",
"food.p2":"Tamarisk goes closest to the sea as a salt and wind break. Cherry, peach and apricot go only in the moister lower ground. Chickpea ripens by mid month 8, before watering would be needed. Clover feeds nitrogen back into the soil and buhač keeps insects down without a spray.",
"food.cap":"Species already growing on the site and species to be introduced.",

"craft.kicker":"Stone and craft",
"craft.h":"The wall is the infrastructure",
"craft.p1":"Dry stone terracing is what makes agriculture possible on karst. It holds soil, slows water and shelters roots, and it is built without mortar from the stone already lying in the field. Dry stone walling is protected Croatian intangible heritage and is inscribed on the UNESCO list.",
"craft.p2":"We intend to survey and repair the existing walls, enter them into the open public inventory at suhozid.hr, and host a workshop with the association 4 Grada Dragodid, who have been teaching the craft since their first workshop on Vis in 2002.",
"craft.cap":"Bunja, section drawing. The round dry stone field hut with a conical roof of stone slabs, the building type we intend to use.",

"test.kicker":"Test ground",
"test.h":"Every solution is an experiment with a published result",
"test.p":"The site is a demonstration ground, so each of these is set up to be measured rather than admired. If something does not work in this climate, that is a result worth publishing too.",

"sound.kicker":"Sound",
"sound.h":"An old plan finding its ground",
"sound.p1":"Years ago Marko wrote a plan called Sound Village: energy independent houses in permaculture gardens, built for research into sound and movement. Small structures demonstrating acoustic phenomena, each house holding one old sound culture, and a central building with a hall and a studio. It was never built. Kukljica is where it becomes possible.",
"sound.p2":"The Integratron in the Mojave desert is worth naming here for one reason only, its acoustics. An all wood domed chamber, built without nails, still studied for how it behaves as a room. The claims made about it by its builder are not part of this project. The building geometry is.",
"sound.p3":"Marko is a percussionist, founder of the Tribal Jam Orchestra, and a student of frame drum with Yshai Afterman. He performs as DJ Mantra with organic house and the set concept Od Gangesa do Amazone. Sound belongs on this land the way the bees do, as part of how the place works.",
"sound.cap":"Above the project land. Bačina uvala, Kukljica, island of Ugljan.",
"sound.quote":"The drone carries across the sea. Up here the earth does not care about continents or borders, and the didgeridoo has been singing the same thing for forty thousand years, that we are echoes of one song played on different instruments in different lands.",
"sound.quoteby":"Marko Boško, 19.12.2025, sitting on the stone above the land",

"live.kicker":"Living here",
"live.h":"The heat writes the timetable",
"live.pull":"Work starts at first light, while the stone is still cool. The middle of the day belongs to the sea.",
"live.volh":"Volunteers",
"live.volp":"Work exchanged for food and accommodation, listed on Workaway and WWOOF. Accommodation is basic: compost toilet, outdoor kitchen, simple shelter, no mains water. The work is physical, hot and slow. Anyone who wants comfort should read that sentence twice.",
"live.kidsh":"Children",
"live.kidsp":"Auroville runs free progress schools, where a child follows their own interest and pace rather than a fixed grade. A working landscape is a good place for that. Children come with their families, and there is real work here they can do at their own size.",
"live.cap":"All life is yoga. Sri Aurobindo.",

"who.kicker":"Who",
"who.h":"Two people who have both spent their lives looking at plants",
"who.p1":"Marko Boško has twenty seven years in media production, currently as a video editor at Nova TV in Zagreb, and works as a filmmaker, sound designer and composer under Mantra Productions. He spent seven years in Auroville, the township in South India founded on the Integral Yoga of Sri Aurobindo and the Mother, living alongside Sadhana Forest as it turned eroded ground into forest.",
"who.p2":"He is a percussionist and founder of the Tribal Jam Orchestra, a yoga teacher and author of the Sun Moon Yoga method, and performs as DJ Mantra. He is based between Zagreb and Rijeka, with family roots in Zadar, twenty minutes by ferry from the land.",
"who.p3":"Two things from that working life matter here more than the rest. He trained as an engineer in industrial electronics and worked as a system and network administrator before the cameras, which is the skill set the test ground needs. And he documents for a living, so the survival rates, the water readings and the failures will be recorded properly and published rather than remembered loosely.",
"who.tonicap":"Toni Franović in his studio in Legrad.",
"who.tonip2":"He writes about painting as a natural cycle, taking decay and growth as equal parts of the same process. That is also the argument of this project. A landscape is not restored by being tidied, it is restored by letting the slow part of the cycle run its course again.",
"who.tonih":"Toni Franović",
"who.tonip":"Painter, co-author of this project. Born in Zagreb in 1964, he graduated from the Academy of Fine Arts in Zagreb in 1990 and taught life drawing and painting in nature there from 1995 to 2004. He is a professor at Sveučilište Sjever in Koprivnica and lives on an ecological estate in Legrad. He has spent his working life studying the flora of the southern Adriatic and the Mediterranean, which is why the plant list on this site is his as much as anyone's.",
"who.cap":"Marko Boško.",

"ph.kicker":"Phases",
"ph.h":"Where the project actually is",

"inf.kicker":"Influences",
"inf.h":"Where this comes from",
"inf.p":"These are the projects and practices that shaped this plan. They are listed as sources rather than as company we claim to keep.",

"join.kicker":"Join",
"join.h":"Come and work, or help it start",
"join.p":"The project is at the beginning. The most useful things right now are hands, expertise and introductions, in that order.",

"nav.owners":"Owners",
"own.kicker":"Owner's manual",
"own.h":"Who holds the land we want to buy",
"own.p1":"Before an NGO can restore a hillside it has to own it, and on this hillside the land is cut into many small cadastral parcels, each held by one or more families. This section is the working file for that purchase: who holds which parcel, who holds the most, how the parcels are sized and shared, and in what order to approach the holders. It is built from public cadastral data.",
"own.lead":"The project covers {n} private parcels, {ha} ha in total, recorded on {s} possession sheets that name {p} people. By sheet, the largest holding is {top}: {topm} m² across {topc} parcels. By person, the largest is {tp}, with about {tpm} m².",
"own.legal":"A possession sheet (posjedovni list) is a cadastral record of who uses a parcel. It is not proof of ownership. Ownership is proven only by the land-registry extract (zemljišnoknjižni izvadak). The sheets used here date from {pld} and holders may have died or sold since, so every name below must be checked against the land registry before any offer is made.",

hr:{
"credit.kacan":"Zračne fotografije Boris Kačan · boriskacan.com · objavljeno uz dopuštenje",
"land.cap2":"Rt i prevlaka koja ga spaja s ostatkom zemlje. Svijetla crta je put po žalu.",
"hist.cap":"Sklop alepskog bora na čestici. Gust, ujednačen i gotovo neprekinut, a ispod njega se još čitaju stare linije terasa.",
"water.cap2":"Plićina sa zapadne strane. Tamne mrlje su morska trava, a svijetli rub je vapnenac koji ne drži ni kap vode.",
"craft.cap2":"Kameni rub obale. Svaki suhozid na čestici sagrađen je od ovoga, skupljenog rukom ondje gdje je ležao.",
"live.cap2":"Ono malo kuća uz obalu. To je cijeli izgrađeni krajolik ovdje i namjera je da tako i ostane.",
"nav.trees":"Četiri stabla",
"tr.kicker":"Četiri stabla",
"tr.h":"Četiri stabla, četiri sile na istom tlu",
"tr.p":"Ova četiri nose projekt. Ne zato što su jedine vrste koje idu u zemlju, nego zato što svako rješava drugi problem koji ova zemlja postavlja, a zajedno pokrivaju cijeli. Sva četiri rasla su ovdje davno prije nego je itko išta zapisao.",
"tr.fifth":"Peta nije stablo. To je pčela, koja obilazi sva četiri i drži godinu na okupu, i zbog nje kalendar na ovoj stranici uopće postoji.",
"phil.kicker":"Zašto autohtono",
"phil.h":"Rastemo naprijed iz onoga što je već bilo ovdje",
"phil.p1":"Postoji način poljoprivrede koji traži stalnu podršku. Dovedeš vrstu koja se ovdje nije razvila, i onda ostatak života provedeš braneći je. Zalij, nahrani, poprskaj, zamijeni. Biljka se nikad ne primi, tlo se nikad ne izgradi, a posao nikad ne prestane. To nije poljoprivreda, to je održavanje na aparatima.",
"phil.pull":"Kad stara maslina istjera mladicu iz panja, to nije novo stablo. To je novi izraz istog genotipa.",
"phil.p2":"Autohtona vrsta ne traži ništa od toga. Tisućama godina birala ju je upravo ova kiša, ovo tanko tlo, ovaj vjetar i ovi nametnici. Ona zna da ljeto dolazi. Sve što joj treba već je zapisano u njoj. Posadiš je, čuvaš dvije ili tri godine, i onda preuzme vlastiti život.",
"phil.p3":"Zato je maslina znak ovog projekta. U prirodnom stanju maslina zapravo nikad ne umire od starosti. Kad se deblo izduplji, izgori ili ga posijeku, iz panja se dižu mladice i stablo se nastavlja, isti pojedinac u novom obliku. To je cijeli argument u jednoj biljci: ne kreće se ispočetka iz ničega, nego se raste naprijed iz onoga što je već bilo ovdje.",
"phil.p4":"Sadhana Forest to je pokazao na drugom kraju svijeta. Aviram i Yorit Rozin prodali su 2003. kuću u Izraelu i s malom kćeri se preselili na sedamdeset jutara erodiranog, golog tla kraj Auroville, da vrate tropsku suhu zimzelenu šumu, koje je preostalo manje od jedne stotinke postotka. Ništa se nije trajno navodnjavalo. Prvo su radili na vodi, usporavali je, razvlačili i upijali u zemlju umjesto da monsun otječe s gole zemlje ravno u more. Tek onda su sadili, i to isključivo autohtone vrste, desetke tisuća sadnica u sto šezdeset vrsta.",
"phil.p5":"Ono što vrijedi ponoviti je što se dogodilo poslije. Šuma se počela saditi sama. Vratile su se ptice i životinje, raznijele sjeme, i danas na svako stablo posađeno rukom šuma podigne još nekoliko svojih. To ekosustav radi čim mu prestaneš smetati i vratiš mu njegove vrste. Prestaje biti projekt i postaje mjesto. To i mi tražimo ovdje, na sedam hektara hrvatskog krša, s maslinom, bademom, smokvom i crnikom umjesto tropske zimzelene šume, i s istom jednostavnom disciplinom: prvo voda, samo autohtone vrste, i dovoljno strpljenja da zemlja odradi najveći dio posla.",
"tr.pairh":"Rade i u dva para",
"tr.pairp":"Pogledaj što daju ta četiri stabla i sama se poslože dvaput. Dva daju mast, gustu i sporu energiju koja se čuva. Dva daju ugljikohidrate, brzu energiju. A poprijeko tome, dva se moraju obraditi da bi ih čovjek uopće mogao jesti, dok se druga dva samo osuše.",
"tr.mfat":"Mast","tr.mcarb":"Ugljikohidrati",
"tr.mwork":"Traži rad","tr.mdry":"Traži samo sušenje",
"tr.molive":"Maslina","tr.moliveD":"Gorka i nejestiva sa stabla. Konzervira se ili tiješti. Ulje se drži godinu dana u tamnoj boci.",
"tr.moak":"Crnika","tr.moakD":"Iz žira se ispiru tanini, pa se melje u brašno i peče. Kruh od žira peče se na mediteranskim otocima još od paleolitika.",
"tr.malmond":"Badem","tr.malmondD":"Otprilike pola masti. U ljusci izdrži do sljedeće berbe bez ikakvog posla.",
"tr.mfig":"Smokva","tr.mfigD":"Suši se na lesi na suncu. Šećer se koncentrira, i dobra godina te hrani do sljedeće.",
"tr.pairp2":"Ta druga os nije fusnota. Dvije namirnice koje traže rad bile su i najcjenjenije, jer je rad bio način čuvanja. Na Sardiniji se kruh od žira prodavao skuplje od pšeničnog upravo zato što ga je bilo teže napraviti, a žene koje su ga pekle bile su po tome poznate. Latinsko ime crnike, ilex, izvodi se iz eligo, izabrati. To je bilo stablo koje se biralo.",
"tr.honest":"Poštena granica: ova četiri daju mast i ugljikohidrate, ne cjelovitu prehranu. Bjelančevine dolaze od slanutka na terasama, a povijesno od mora i od ovaca. Nitko ovdje nikad nije živio samo od stabala.",
"bun.real.h":"Prave bunje, Brač, svibanj 2014.",
"bun.real.p":"Ovo su fotografije, moje, snimljene na Braču 27. svibnja 2014. Obnovljene bunje koje se još koriste: kamena terasa, agave u teglama, masline uokolo, a na dvije od njih solarna ploča položena na krov od kamenih ploča.",
"bun.r1":"Bunja među maslinama, Brač.","bun.r2":"Dvije bunje na padini iznad mora.","bun.r3":"Obnovljena bunja s kamenom terasom i agavama.",
"bun.r4":"Solarna ploča na krovu od kamenih ploča: najstarija gradnja obale nosi novu struju.","bun.r5":"Uska vrata, ploča iznad njih, ništa više ne treba.","bun.r6":"Kamene stube do bunje.",
"gg.kicker":"Projekt izdanak","gg.h":"Green and Go Croatian Islands",
"gg.p1":"Električni skuteri za najam na hrvatskim otocima, iz obnovljenih brodskih kontejnera: jedan kontejner na svakom otoku do kojeg se može doći autom, u sezoni. Izrastao je iz ove zemlje i počinje ovdje, na Ugljanu, u Kukljici, gdje poznajemo teren i ljude.",
"gg.p2":"Dvije ideje sastaju se u suncu. Bunja s pločom na krovu može puniti ono što se tiho kreće otokom, kao što solarna bunja na Braču već radi.",
"gg.c":"Bunja sa solarnom pločom, Brač, svibanj 2014. Fotografija: Marko Boško.","gg.link":"Green and Go Croatian Islands, stranica projekta →",
"bun.h":"Bunja, ono što namjeravamo graditi",
"bun.p1":"Bunja je okrugla poljska kućica ove obale, građena od kamena koji leži u polju i ni od čega drugog. Zid ide debeo i kružan, a krov je na lažni svod, svaki prsten ravnih ploča stupa malo više prema unutra od onog ispod dok ga jedan zaglavni kamen ne zatvori. Bez morta, bez drvene konstrukcije, bez dovezenog materijala. Isto načelo kao i kod suhozida, samo okrenuto uvis u kupolu.",
"bun.p2":"Radi zbog onoga od čega je. Zidovi debeli i do osamdeset centimetara drže noćnu hladnoću kroz sredinu dana, kamen ne gori, a kad bunja jednom padne opet postane hrpa kamena i nema se što odvoziti. Namjeravamo ih ovdje podići nekoliko, za sklonište, za spremanje alata i za radionicu, istom metodom kojom će se obnavljati i suhozidi.",
"bun.p3":"Ono što je čini ovdašnjom jest odakle dolazi kamen. Na kršu ne možeš obrađivati dok ne iskrčiš kamen, a iskrčeni kamen mora nekamo. Išao je u suhozide, a ono što bi preteklo išlo je u kućicu. Za jednu treba oko trideset kubika kamena. Građevina nije postavljena na polje, ona je ono što je polje moralo dati od sebe da bi uopće postalo polje.",
"bun.p4":"Njihovo veliko doba bilo je 18. i 19. stoljeće, kad je rast stanovništva gurao nove maslinike i vinograde na sve kamenitiji teren. Davale su hlad u radnom danu i zaklon u nevremenu, a pred berbu se u njima spavalo da se čuva urod. Koristili su ih pastiri. U selima je isti oblik postajao svinjac ili staja za magarca. Mnoge su kasnije samljevene za građevinski materijal, što je i inače uobičajen način na koji ovakva baština nestaje.",
"bun.c1":"Jedna bunja u starom masliniku. Jedan prozor, jedna niska vrata, sve ostalo kamen.",
"bun.c2":"Iznutra. Debeo zid, duboki prozor, dvije niše i lažni svod koji se zatvara malim otvorom na vrhu.",
"bun.c3":"Krov odozdo. Ravne ploče slagane u prstenove, svaki uvučen prema unutra, drži ih samo težina i trenje.",
"bun.c4":"Dvije na obalnoj padini. Manja nema prozor i služi za alat, veća je za sklonište.",
"bun.c5":"Na pola visine. Kamen se prvo posloži po veličini na tlu, a to je i najveći dio posla.",
"bun.c6":"Suhozid. Isti zanat, isti kamen, samo položen ravno umjesto u luk.",
"bun.note":"Ovih šest prikaza su vizualizacije tipa gradnje, izrađene za ovu stranicu. To nisu fotografije postojećih građevina niti fotografije ove čestice.",
"nav.growing":"Uzgoj hrane",
"gr.kicker":"Uzgoj hrane",
"gr.appk":"Aplikacija · Tri kulture","gr.appp":"Žitarica, mahunarka i uljarica: izaberi svoje tri, suži ih kao granama stabla i pogledaj na klimatskoj karti svijeta gdje rastu zajedno samo na kiši.","gr.appl":"Otvori aplikaciju tri kulture →",
"gr.h":"Jedan dan mjesečno, i hrana je gotova",
"gr.p1":"Postoji dokumentirano mediteransko malo gospodarstvo koje u potpunosti prehranjuje jednu osobu sa 740 četvornih metara, uz prosječno jedan radni dan mjesečno, bez umjetnog gnojiva, herbicida i pesticida. Tako radi od 2013., izmjereno je i objavljeno u recenziranom časopisu. Vlasnik uz to ima puno radno vrijeme drugdje.",
"gr.p2":"Iznosimo to ovdje jer odgovara na pitanje koje se uz ovakav projekt uvijek postavi, a to je je li strana s hranom realna ili romantična. Realna je, a razlog je izbor kultura. Osnovica su zimska žitarica za ugljikohidrate, zimska mahunarka za bjelančevine i maslinovo ulje za mast, a sve troje izabrano je zato što je autohtono, i upravo zato im kemija uopće ne treba.",
"gr.f1":"m² hrani jednu osobu","gr.f2":"radni dan mjesečno","gr.f3":"površine bez navodnjavanja","gr.f4":"umjetnih ulaza","gr.f5":"kg maslinovog ulja godišnje","gr.f6":"godina dotjerivanja",
"gr.areah":"Kamo ide površina",
"gr.areap":"Omjeri su cijeli argument. Povrtnjak zauzima manje od petine zemlje, odnosi otprilike pola ukupnog rada, troši svu vodu za navodnjavanje i vraća oko petnaest posto kalorija. Žito, mahunarka, ulje i šećer zauzimaju sve ostalo, žive samo od kiše i nose prehranu.",
"gr.s1h":"Povrtnjak, jedna četvrtina svaki mjesec",
"gr.s1p":"Vrt je podijeljen na četiri gredice od oko 35 četvornih metara. Svaki mjesec se jedna gredica gradi ispočetka, uvijek ona s najstarijom kulturom, pa su sve četiri stalno u četiri različite faze i uvijek postoji zrela gredica s koje se jede. Cijeli ciklus ispod traje oko četiri sata.",
"gr.c1":"Četiri gredice u četiri faze. Jedna obnovljena, jedna tek posađena, jedna napola narasla, jedna spremna za rez.",
"gr.s1n":"Obnova ide u 9., 10., 11. i 2. mjesecu za zimske kulture te u 3., 4., 5. i 6. za ljetne. U 12. i 1. mjesecu ne sadi se ništa jer je prehladno da se išta miče, ni u 7. i 8. jer je prevruće.",
"gr.s2h":"Žito i mahunarka, četiri dana za cijelu godinu",
"gr.s2p":"Pšenica i bob siju se zajedno u 12. mjesecu i žanju zajedno u 5. Između ta dva datuma parcela se uopće ne dira. Dvanaest godina na nju nije došao ni gram komposta.",
"gr.c2":"Pšenica i bob spremni. Dozrijevaju u različito vrijeme, ali se režu i vrše kao jedan posao.",
"gr.s2n":"Stabljike se režu, nikad ne čupaju. Iščupane biljke donesu zemlju i sitno kamenje u vršidbu, a to je pretaško da ga puhalo izbaci, pa završi u zrnu.",
"gr.s3h":"Maslinovo ulje, dva dana u 11. mjesecu",
"gr.s3p":"Devet stabala srednje veličine daje oko 200 kg maslina, iz čega se istiješti 40 do 50 kg ulja. To je otprilike dvostruko više nego što jedna osoba potroši u godini, a višak je ono što se daruje. Dva zrela stabla pokrila bi jednu osobu.",
"gr.c3":"Plahte razastrte pod stablom. Cijela berba je jedan dan za devet stabala.",
"gr.s4h":"Šećer, jedan dan u 8. mjesecu",
"gr.s4p":"Rogač je šećer. Autohton je, na ovoj obali je tisućljećima, raste divlje i ne treba mu ništa ni od koga. Jedan dan rada u najtoplijem mjesecu godine napravi sladilo za cijelu godinu.",
"gr.c4":"Rogačeve mahune, ukuhavanje i godišnji šećer u staklenkama.",
"gr.s4n":"Ukuhavanje se prekida znatno prije nego izgleda gotovo. Sirup se hlađenjem jako zgusne, pa ako ga vrućeg dovedeš do gustoće koju zapravo želiš, stegne se u bombon.",
"gr.pesth":"Nametnici, i zašto ih autohtone kulture nemaju",
"gr.pestp":"Pšenicu, bob, masline i rogač jedva da išta dira, jer su domaći i nisu daleko odselekcionirani od onoga što su bili. Problem je gotovo isključivo u povrtnjaku, gdje mnoge vrste nisu odavde. To je isti argument na kojem stoji cijeli ovaj projekt, samo stiže sa strane tanjura.",
"gr.lessonh":"Što od toga uzimamo",
"gr.lessonp":"Gotovo sve se prenosi. Kukljica ima istu klimu, isti raspored kiša, iste četiri osnovne namirnice i isti problem tankog tla na vapnencu. Razlike su da je naš teren strmiji i kamenitiji, što znači terase prije gredica, i da na terenu nemamo nimalo vode, što cijelo pitanje vode stavlja ispred cijelog pitanja hrane. Redoslijed posla ovdje nije stvar ukusa. To je jedini redoslijed koji može raditi.",
"gr.source":"Izvor: Pelman, Nachtomy i Carmel, Individual nutritional self-sufficiency, a viable option in the present era, Frontiers in Sustainable Food Systems, 2024. Brojke su iz objavljene studije gospodarstva Alika Pelmana. Slike na ovoj stranici su vizualizacije izrađene za ovu stranicu, a ne fotografije tog gospodarstva ni ove čestice.",

"hero.lede":"Sedam hektara obnove. Vraćamo krajolik koji je hranio ovu obalu dvije tisuće godina i pokazujemo kako se u njemu živi.",
"hero.cta1":"Volontiraj","hero.cta2":"Pročitaj metodu",

"land.kicker":"Zemlja",
"land.h":"Četiri čestice iznad dvije uvale",
"land.p1":"Teren leži u Bačinoj uvali, ispod grebena Čelinjak na otoku Ugljanu, dvadeset minuta trajektom od Zadra. Katastarske čestice 2448/6, 2448/14, 2448/13 i 2449/1, izmjereno 7,02 hektara uz 1,11 km opsega.",
"land.p2":"Na njemu su stare maslinske terase u stanju iz kojeg se mogu vratiti, suhozidi, makija i sve gušći pokrov alepskog bora. Većini maslina treba rezidba, a ne nova sadnja. Nema pouzdane površinske vode ni bunara; obiteljsko sjećanje smješta izvor na zemlju, još ga treba pronaći.",
"land.legend":"ZELENO = raste ovdje i ostaje · NARANČASTO = uklanja se · MASLINASTI OKVIR = sadi se",
"land.cap":"ARKOD izmjera čestice. Opseg 1,11 km, površina 7,02 ha, s duljinama pojedinih sekcija.",

"hist.kicker":"Što se ovdje dogodilo",
"hist.h":"Šuma koja pripada ovom mjestu posječena je za brodove",
"hist.p1":"Jadranske otoke izvorno je pokrivala zimzelena šuma crnike, Quercus ilex, a ispod nje crni grab, tršlja, mirta, planika i lovor. Makija, garig i goli kamenjar njezini su stupnjevi degradacije, a ne prirodno stanje.",
"hist.p2":"Sječa je trajala stoljećima i imala više uzroka: drvo za brodogradnju, među njima i dugo venecijansko vađenje hrastovine iz Dalmacije, zatim ogrjev, paljenje vapna, ispaša koza i ovaca koja je zaustavljala obnovu, te krčenje za vinograde i masline koje se pojačalo kroz 19. stoljeće. Prve fotografije ove obale pokazuju krajolik gotovo bez drveća.",
"hist.pull":"Ono što je posađeno umjesto nje birano je po brzini, a ne po mjestu.",
"hist.p3":"Uslijedio je gubitak tla, pa se pošumljavanje pojačalo od kraja 19. stoljeća pod austrougarskom upravom. Odabran je alepski bor, Pinus halepensis, jer podnosi sušu i osvaja degradirano tlo. Namjera je bila izgraditi tlo da se crnika može vratiti. To se uglavnom nije dogodilo. Alepski bor danas se agresivno sam sije, dominira priobalnim krajolikom, guši floru ispod sebe i nosi vrlo visok rizik od požara. Uklanjamo brze vrste i vraćamo spore, na sedam hektara, da barem jedan potez ove obale pokaže što otok zaista jest.",

"meth.kicker":"Metoda",
"meth.h":"Pet linija rada, svaka s nečim što se može izbrojati",
"meth.p":"Model je Sadhana Forest, osnovan 2003. kraj Auroville, koji su pokrenuli Aviram i Yorit Rozin i koji je sedamdeset jutara erodiranog tla pretvorio u autohtonu šumu, samo volonterima, zemljanim radovima za zadržavanje vode i domaćim vrstama. Oni objavljuju svoje stope preživljavanja sadnica. Objavljivat ćemo i mi, uključujući sezone koje prođu loše.",
"meth.sketchh":"Rezidba je prvi zahvat",
"meth.sketchp":"Većina ovdašnjih maslina nije mrtva, nego zarasla. Metoda je odrezati izdanke iz korijena, ostaviti jednu glavnu žilu ili dvije do tri gdje su već dobro razvijene, i otvoriti krošnju da prolaze svjetlo i zrak. Obnova rezidbom ne košta ništa osim ruku, a vraća maslinik koji već ima četrdeset ili sto godina. Sadnja novog stabla umjesto toga kupuje ti desetljeće čekanja.",
"meth.sketchcap":"Radna skica. Izdanci prekriženi, ostavljene dvije do tri glavne žile, figura za mjerilo.",
"meth.note":"Ništa na ovoj stranici nije označeno kao gotovo ako nije gotovo. Projekt je u fazi 0.",

"water.kicker":"Voda",
"water.h":"Izvor koji tek treba pronaći, a rose ima jako puno",
"water.p1":"Voda je najteži problem ovog terena i rješava se prva, prije bilo kakve sadnje. Ništa se ne navodnjava trajno. Navodnjavanje postoji samo da se mlado drveće primi, i onda prestaje.",
"water.p2":"Lišajevi i mahovina na nižem terenu pokazuju vrlo visoku rosu, a to je resurs, ne zanimljivost. Podzemna voda otječe s Čelinjaka u Bačinu uvalu, a svaki izvor blizu obale mora se provjeriti na prodor soli prije upotrebe.",
"water.cap":"Greben Čelinjak, V. vrh na 122,8 m, i otjecanje u Bačinu uvalu.",

"cal.kicker":"Kalendar",
"cal.h":"Godina određuje posao, a ne plan",
"cal.p":"Mediteranskim terenom upravlja fenologija. Ono što cvate govori na čemu su pčele, što se smije rezati, što se destilira i što mora čekati. Ovaj prsten je radni kalendar. On je ujedno i pošten odgovor na pitanje kada doći i što bi ovdje stvarno radio.",
"cal.k1":"Cvate","cal.k2":"Paša","cal.k3":"Posao",
"cal.note":"Kalendar je privremen, sastavljen iz regionalne fenologije i projektnog dokumenta. Ispravljat će ga promatranje na samom terenu, a ispravci će biti objavljeni.",

"food.kicker":"Šuma hrane",
"food.h":"Drveće kojem ne treba zalijevanje",
"food.p1":"Sve što se sadi mora preživjeti dalmatinsko ljeto bez navodnjavanja kad se jednom primi. To izbacuje većinu onoga što se prodaje u vrtnim centrima i uvodi ono što se ovdje uzgajalo stoljećima.",
"food.p2":"Tamaris ide najbliže moru kao zaštita od soli i vjetra. Trešnja, breskva i marelica idu samo u vlažniji niži teren. Slanutak dozrijeva do sredine 8. mjeseca, prije nego bi trebalo zalijevati. Djetelina vraća dušik u tlo, a buhač drži kukce podalje bez prskanja.",
"food.cap":"Vrste koje već rastu na terenu i vrste koje se uvode.",

"craft.kicker":"Kamen i zanat",
"craft.h":"Suhozid je infrastruktura",
"craft.p1":"Suhozidne terase su ono što uopće omogućuje poljoprivredu na kršu. Drže tlo, usporavaju vodu i štite korijenje, a grade se bez veziva od kamena koji već leži u polju. Suhozidna gradnja zaštićeno je hrvatsko nematerijalno kulturno dobro i upisana je na UNESCO-vu listu.",
"craft.p2":"Namjeravamo popisati i obnoviti postojeće suhozide, unijeti ih u otvoreni javni inventar suhozid.hr i ugostiti radionicu udruge 4 Grada Dragodid, koja podučava ovaj zanat od prve radionice na Visu 2002.",
"craft.cap":"Bunja, crtež presjeka. Okrugla suhozidna poljska kućica s konusnim krovom od kamenih ploča, tip gradnje koji namjeravamo koristiti.",

"test.kicker":"Poligon",
"test.h":"Svako rješenje je pokus s objavljenim rezultatom",
"test.p":"Teren je demonstracijski, pa je svaki od ovih postavljen tako da se mjeri, a ne da se divimo. Ako nešto ne radi u ovoj klimi, i to je rezultat vrijedan objave.",

"sound.kicker":"Zvuk",
"sound.h":"Stari plan koji je našao tlo",
"sound.p1":"Marko je prije mnogo godina napisao plan pod imenom Sound Village: energetski neovisne kuće u permakulturnim vrtovima, građene za istraživanje zvuka i pokreta. Male građevine koje demonstriraju akustične pojave, kuće od kojih svaka nosi jednu drevnu zvučnu kulturu, i središnja zgrada s dvoranom i studijem. Nikad nije izgrađen. U Kukljici postaje moguć.",
"sound.p2":"Integratron u pustinji Mojave spominjemo iz jednog jedinog razloga, zbog akustike. Drvena kupolasta dvorana građena bez ijednog čavla, koja se i danas proučava po tome kako se ponaša kao prostorija. Tvrdnje njezina graditelja nisu dio ovog projekta. Geometrija zgrade jest.",
"sound.p3":"Marko je perkusionist, osnivač Tribal Jam Orchestra i učenik okvirnog bubnja kod Yshaija Aftermana. Nastupa kao DJ Mantra s organic house setom pod nazivom Od Gangesa do Amazone. Zvuk pripada ovoj zemlji jednako kao i pčele, kao dio načina na koji mjesto radi.",
"sound.cap":"Iznad projektne zemlje. Bačina uvala, Kukljica, otok Ugljan.",
"sound.quote":"Ton putuje preko mora. Ovdje gore zemlju ne zanimaju kontinenti ni granice, a didgeridoo pjeva istu stvar već četrdeset tisuća godina, da smo odjeci jedne pjesme svirane na različitim instrumentima u različitim zemljama.",
"sound.quoteby":"Marko Boško, 19.12.2025., sjedeći na kamenu iznad zemlje",

"live.kicker":"Život ovdje",
"live.h":"Vrućina piše raspored",
"live.pull":"Posao počinje u prvo svjetlo, dok je kamen još hladan. Sredina dana pripada moru.",
"live.volh":"Volonteri",
"live.volp":"Rad u zamjenu za hranu i smještaj, oglašeno na Workaway i WWOOF. Smještaj je osnovan: kompostni zahod, vanjska kuhinja, jednostavno sklonište, bez vodovoda. Posao je fizički, vruć i spor. Tko traži udobnost, neka tu rečenicu pročita dvaput.",
"live.kidsh":"Djeca",
"live.kidsp":"U Auroville rade free progress škole, gdje dijete prati vlastiti interes i ritam umjesto zadanog razreda. Radni krajolik je dobro mjesto za to. Djeca dolaze s obitelji, a ovdje ima stvarnog posla koji mogu raditi u svojoj mjeri.",
"live.cap":"All life is yoga. Sri Aurobindo.",

"who.kicker":"Tko",
"who.h":"Dvoje ljudi koji su život proveli gledajući biljke",
"who.p1":"Marko Boško ima dvadeset sedam godina u medijskoj produkciji, trenutno kao montažer na Novoj TV u Zagrebu, i radi kao filmaš, sound dizajner i skladatelj pod imenom Mantra Productions. Sedam godina proveo je u Auroville, gradu u južnoj Indiji utemeljenom na Integralnoj yogi Sri Aurobinda i Majke, živeći uz Sadhana Forest dok je erodirano tlo pretvarao u šumu.",
"who.p2":"Perkusionist je i osnivač Tribal Jam Orchestra, učitelj yoge i autor metode Sun Moon Yoga, a nastupa kao DJ Mantra. Živi između Zagreba i Rijeke, s obiteljskim korijenima u Zadru, dvadeset minuta trajektom od zemlje.",
"who.p3":"Dvije stvari iz tog radnog vijeka ovdje znače više od ostalog. Školovao se za inženjera industrijske elektronike i radio kao sistem i mrežni administrator prije kamera, a upravo to traži poligon. I dokumentiranje mu je zanat, pa će stope preživljavanja, očitanja vode i neuspjesi biti uredno zabilježeni i objavljeni, a ne tek otprilike zapamćeni.",
"who.tonicap":"Toni Franović u svom ateljeu u Legradu.",
"who.tonip2":"O slikarstvu piše kao o prirodnom ciklusu, uzimajući raspadanje i rast kao jednako vrijedne dijelove istog procesa. To je ujedno i teza ovog projekta. Krajolik se ne obnavlja tako da ga se uredi, nego tako da se sporom dijelu ciklusa opet dopusti da odradi svoje.",
"who.tonih":"Toni Franović",
"who.tonip":"Slikar, suautor ovog projekta. Rođen u Zagrebu 1964., diplomirao na Akademiji likovnih umjetnosti u Zagrebu 1990., gdje je od 1995. do 2004. predavao crtanje akta i slikanje u prirodi. Profesor je na Sveučilištu Sjever u Koprivnici i živi na ekološkom imanju u Legradu. Radni vijek proveo je proučavajući floru južnog Jadrana i Mediterana, zbog čega je popis biljaka na ovoj stranici jednako njegov koliko i bilo čiji.",
"who.cap":"Marko Boško.",

"ph.kicker":"Faze",

"join.kicker":"Pridruži se",

         <div class="el">${L(t[0],t[1])}</div>
         <h3>${L(t[2],t[3])}</h3>
         <div class="lat">${t[4]}</div>
         <p>${L(t[6],t[7])}</p>
       </div>
     </div>`).join('');

  document.getElementById('phaselist').innerHTML = PHASES.map(p=>
    `<div class="phase${p[4]?' now':''}"><div class="ph">${L(p[0],p[1])}</div><p>${L(p[2],p[3])}</p></div>`).join('');

  document.getElementById('inflist').innerHTML = INF.map(i=>{
    const t = i[4] ? `<a href="${i[4]}" target="_blank" rel="noopener">${L(i[0],i[1])}</a>` : L(i[0],i[1]);
    return `<div><h4>${t}</h4><p>${L(i[2],i[3])}</p></div>`;}).join('');
}

function ring(){
  const svg=document.getElementById('ring'), cx=200, cy=200, rO=180, rI=74;
  let s='';
  for(let k=0;k<7;k++){const r=rI+(rO-rI)*k/7;s+=`<circle class="slabarc" cx="${cx}" cy="${cy}" r="${r}"/>`;}
  for(let m=1;m<=12;m++){
    const a0=(m-1)*30-90, a1=m*30-90, rad=d=>d*Math.PI/180;
    const p=(r,a)=>[cx+r*Math.cos(rad(a)),cy+r*Math.sin(rad(a))];
    const [x1,y1]=p(rI,a0),[x2,y2]=p(rO,a0),[x3,y3]=p(rO,a1),[x4,y4]=p(rI,a1);
    const [tx,ty]=p((rI+rO)/2,a0+15);
    s+=`<path class="sector" data-m="${m}" d="M${x1} ${y1} L${x2} ${y2} A${rO} ${rO} 0 0 1 ${x3} ${y3} L${x4} ${y4} A${rI} ${rI} 0 0 0 ${x1} ${y1} Z"><title>${m}</title></path>`;
    s+=`<text x="${tx}" y="${ty+4}" text-anchor="middle">${m}</text>`;
  }
  s+=`<circle cx="${cx}" cy="${cy}" r="${rI-2}" fill="none" stroke="var(--olive)" stroke-width="1"/>`;
  svg.innerHTML=s;
  svg.querySelectorAll('.sector').forEach(el=>{
    el.addEventListener('click',()=>{month=+el.dataset.m;paint();});
  });
}

function paint(){
  document.querySelectorAll('#ring .sector').forEach(el=>
    el.classList.toggle('on', +el.dataset.m===month));
  const c=CAL[month-1];
  document.getElementById('calmo').textContent = L(month+'.', month+'. mjesec');
  document.getElementById('calflower').textContent=L(c[1],c[2]);
  document.getElementById('calbees').textContent=L(c[3],c[4]);
  document.getElementById('calwork').textContent=L(c[5],c[6]);
}

function apply(){
  document.documentElement.lang = lang;
  document.documentElement.dataset.mode = mode==='day'?'day':'night';
  document.title = lang==='hr' ? 'Kukljica EcoOasis · Obnova ekosustava na otoku Ugljanu'
                               : 'Kukljica EcoOasis · Ecosystem restoration on the island of Ugljan';
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const v=T[lang][el.dataset.i18n]; if(v!==undefined) el.textContent=v;});
  document.getElementById('langbtn').innerHTML = lang==='hr' ? '<b>HR</b> / EN' : 'HR / <b>EN</b>';
  document.getElementById('modebtn').textContent = mode==='day' ? 'NIGHT' : 'DAY';
  build(); paint(); owners();
}

document.getElementById('langbtn').addEventListener('click',()=>{
  lang = lang==='hr'?'en':'hr';
  try{localStorage.setItem('kel',lang)}catch(e){}
  apply();
});
document.getElementById('modebtn').addEventListener('click',()=>{
  mode = mode==='day'?'night':'day';
  try{localStorage.setItem('kem',mode)}catch(e){}
  apply();
});

let owView='sheet', owSel=null, owSort={k:'id',d:1}, owQ='';
const owEsc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tt=(k,v={})=>{const s=T[lang][k]; return typeof s==='string'?s.replace(/\{(\w+)\}/g,(_,n)=>v[n]??''):s;};
const owNum=(n,d=0)=>Number(n).toLocaleString(lang==='hr'?'hr-HR':'en-GB',{minimumFractionDigits:d,maximumFractionDigits:d});
const owD=d=>d.replace(/\.$/,'');

const owPct=x=>owNum(x*100,x<.1?1:0)+' %';
const owIdCmp=(a,b)=>{const pa=a.split('/').map(Number),pb=b.split('/').map(Number);return (pa[0]-pb[0])||((pa[1]||0)-(pb[1]||0));};

/* derived model, built once */
const OWM=(()=>{
  const P=OWN.p.map(([id,m2,s,h,g])=>{const cov=h.reduce((a,x)=>a+x[1],0);return {id,m2,s,h,g,gap:m2-cov,k:h.length};});
  const sheets={};
  for(const [pl,persons] of Object.entries(OWN.pl)) sheets[pl]={pl,persons:persons.map(([n,a,b,note,fam])=>({n,a,b,note,fam})),m2:0,parcels:[]};
  P.forEach(p=>p.h.forEach(([pl,m])=>{sheets[pl].m2+=m;sheets[pl].parcels.push(p.id);}));
  const S=Object.values(sheets).sort((a,b)=>b.m2-a.m2);
  const total=P.reduce((a,p)=>a+p.m2,0);
  const people=new Set(); S.forEach(s=>s.persons.forEach(x=>people.add(x.n)));
  /* person and family totals; a sheet without shares stays one joint row */
  const per={}, fam={};
  S.forEach(s=>{
    const known=s.persons.every(x=>x.a!=null);
    if(known) s.persons.forEach(x=>{
      const m=s.m2*x.a/x.b;
      (per[x.n]??={key:x.n,label:x.n,m2:0,pls:new Set(),note:x.note}).m2+=m; per[x.n].pls.add(s.pl);
      (fam[x.fam]??={key:x.fam,label:x.fam,m2:0,pls:new Set(),ppl:new Set()}).m2+=m; fam[x.fam].pls.add(s.pl); fam[x.fam].ppl.add(x.n);
    });
    else{
      const lab=s.persons.map(x=>x.n).join(' · ');
      per[lab]={key:lab,label:lab,m2:s.m2,pls:new Set([s.pl]),unk:true};
      const fs=[...new Set(s.persons.map(x=>x.fam))], fk=fs.join(' / ');
      (fam[fk]??={key:fk,label:fk,m2:0,pls:new Set(),ppl:new Set(),unk:fs.length>1}).m2+=s.m2;
      fam[fk].pls.add(s.pl); s.persons.forEach(x=>fam[fk].ppl.add(x.n));
    }
  });
  const abroad=[]; S.forEach(s=>s.persons.forEach(x=>{if(/SAD|Australija/.test(x.note)) abroad.push(x);}));
  return {P,sheets,S,total,people,per:Object.values(per).sort((a,b)=>b.m2-a.m2),fam:Object.values(fam).sort((a,b)=>b.m2-a.m2),abroad,
    gap:P.reduce((a,p)=>a+Math.max(0,p.gap),0), mun:OWN.mun.reduce((a,m)=>a+m[1],0)};
})();

function owSheetName(s){return 'PL '+s.pl;}
function owSheetWho(s,withFrac){return s.persons.map(x=>owEsc(x.n)+(withFrac&&x.a!=null?` <span class="x" style="display:inline">${x.a}/${x.b}</span>`:'')).join(' · ');}
function owSelPls(){ if(!owSel) return new Set(); return owSel.pls; }

function owSelect(sel){ owSel=sel; owPaintSel(); owPanel(); }
function owSelectSheets(label,pls,kind){
  const m2=[...pls].reduce((a,pl)=>a+OWM.sheets[pl].m2,0);
  const parcels=new Set(); pls.forEach(pl=>OWM.sheets[pl].parcels.forEach(id=>parcels.add(id)));
  owSelect({kind,label,pls:new Set(pls),m2,parcels});
}

    [owPct(top3),'own.k.top3'],[M.abroad.length,'own.k.abroad'],[owNum(M.gap),'own.k.gap'],[owNum(M.mun/1e4,2),'own.k.muni']];

/* ---- map ---- */
function owMap(){
  const [x0,x1,y0,y1]=OWN.box, pad=.00012, kx=Math.cos(44.036*Math.PI/180), sc=100000;
  const X=lon=>((lon-(x0-pad/kx))*kx*sc), Y=lat=>(((y1+pad)-lat)*sc);
  const W=X(x1+pad/kx), H=Y(y0-pad);
  const path=g=>'M'+g.map(([a,b])=>X(a).toFixed(1)+' '+Y(b).toFixed(1)).join('L')+'Z';
  const cen=g=>{let a=0,cx=0,cy=0;for(let i=0;i<g.length-1;i++){const [xa,ya]=[X(g[i][0]),Y(g[i][1])],[xb,yb]=[X(g[i+1][0]),Y(g[i+1][1])],f=xa*yb-xb*ya;a+=f;cx+=(xa+xb)*f;cy+=(ya+yb)*f;}a/=2;return a?[cx/(6*a),cy/(6*a)]:[X(g[0][0]),Y(g[0][1])];};
  let s=`<title id="owmaptitle">${owEsc(tt('own.maph'))}</title><defs><pattern id="owhatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="var(--muted)" stroke-width="1" opacity=".45"/></pattern><clipPath id="owclip"><rect width="${W}" height="${H}"/></clipPath></defs><g clip-path="url(#owclip)">`;
  OWN.ctx.forEach(([id,m2,g])=>{s+=`<path class="cx" d="${path(g)}"><title>${id} · ${owNum(m2)} m²</title></path>`;});
  OWN.mun.forEach(([id,m2,cov,g])=>{s+=`<path class="mu" d="${path(g)}"><title>${id} · ${owNum(m2)} m² · Općina Kukljica</title></path>`;});
  OWM.P.forEach(p=>{s+=`<path class="pp k${Math.min(p.k,3)} ${p.s}" data-id="${p.id}" tabindex="0" role="button" aria-label="${p.id}" d="${path(p.g)}"/>`;});
  OWM.P.filter(p=>p.m2>=900).forEach(p=>{const [cx,cy]=cen(p.g);s+=`<text x="${cx.toFixed(1)}" y="${(cy+3).toFixed(1)}" text-anchor="middle">${p.id}</text>`;});
  s+='</g>';
  const svg=document.getElementById('owmap'); svg.setAttribute('viewBox',`0 0 ${W.toFixed(0)} ${H.toFixed(0)}`); svg.innerHTML=s;
  const tip=document.getElementById('owtip');
  svg.querySelectorAll('.pp').forEach(el=>{
    const p=OWM.P.find(q=>q.id===el.dataset.id);
    const show=e=>{tip.innerHTML=`<b>${p.id}</b> · ${owNum(p.m2)} m²<br>`+p.h.map(([pl,m])=>`<span class="x">PL ${pl} · ${owNum(m)} m²</span><br>${owSheetWho(OWM.sheets[pl])}`).join('<br>')+(p.gap>0?`<br><span class="x">+ ${owNum(p.gap)} m² ?</span>`:'');
      tip.style.display='block'; const r=tip.getBoundingClientRect(); let x=e.clientX+14,y=e.clientY+14; if(x+r.width>innerWidth-8)x=e.clientX-r.width-14; if(y+r.height>innerHeight-8)y=e.clientY-r.height-14; tip.style.left=Math.max(8,x)+'px'; tip.style.top=Math.max(8,y)+'px';};
    el.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')show(e);});
    el.addEventListener('pointerleave',()=>tip.style.display='none');
    const pick=()=>{tip.style.display='none'; owSelect({kind:'parcel',parcel:p,pls:new Set(p.h.map(x=>x[0])),parcels:new Set([p.id])});};
    el.addEventListener('click',pick);
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick();}});
  });
  const sw=(st,lab)=>`<span><i style="${st}"></i>${tt(lab)}</span>`;
  document.getElementById('owleg').innerHTML=
    sw('background:rgba(42,161,152,.28)','own.leg.k1')+sw('background:rgba(42,161,152,.55)','own.leg.k2')+sw('background:rgba(42,161,152,.88)','own.leg.k3')+
    sw('background:var(--ochre)','own.leg.sel')+sw('border:2px solid var(--olive)','own.leg.core')+sw('border:2px dashed var(--olive)','own.leg.check')+
    sw('background:repeating-linear-gradient(45deg,var(--muted) 0 1px,transparent 1px 4px)','own.leg.mu')+sw('border:1px solid var(--muted)','own.leg.cx');
  owPaintSel();
}
function owPaintSel(){

  document.querySelectorAll('#owmap .pp').forEach(el=>{
    const p=OWM.P.find(q=>q.id===el.dataset.id), on=owSel&&p.h.some(([pl])=>pls.has(pl));
    el.classList.toggle('sel',!!on); el.classList.toggle('dim',!!owSel&&!on);});

/* ---- ranking ---- */
function owRank(){

  document.getElementById('owtabs').innerHTML=tabs.map(t=>`<button type="button" role="tab" aria-selected="${t===owView}" class="${t===owView?'on':''}" data-v="${t}">${tt('own.tab.'+t)}</button>`).join('');
