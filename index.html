  const M=OWM; let rows;
  if(owView==='sheet') rows=M.S.map(s=>({key:owSheetName(s),label:owSheetName(s),sub:s.persons.map(x=>x.n).join(' · '),m2:s.m2,pls:[s.pl],c:s.parcels.length,unk:s.persons.some(x=>x.a==null)}));
  else if(owView==='person') rows=M.per.map(x=>({key:x.label,label:x.label,sub:[...x.pls].map(p=>'PL '+p).join(', ')+(x.note?' · '+x.note:''),m2:x.m2,pls:[...x.pls],unk:x.unk}));
  else rows=M.fam.map(x=>({key:x.label,label:x.label,sub:x.ppl.size+' '+tt('own.people')+' · '+x.pls.size+' '+tt('own.sheets'),m2:x.m2,pls:[...x.pls],unk:x.unk}));
  rows.forEach(r=>{const ps=new Set();r.pls.forEach(pl=>M.sheets[pl].parcels.forEach(id=>ps.add(id)));r.c=ps.size;});
  const max=rows[0].m2;
  const top3=rows.slice(0,3).reduce((a,r)=>a+r.m2,0)/M.total;
  document.getElementById('owranknote').textContent=tt('own.note.'+owView,{n:rows.length,p:owPct(top3)});
  const box=document.getElementById('owrank');
  box.innerHTML=rows.map(r=>`<div class="owbar" role="button" tabindex="0" data-key="${owEsc(r.key)}"><div class="nm">${owEsc(r.label)}<small>${owEsc(r.sub)}</small></div><div class="tr"><i class="${r.unk?'unk':''}" style="width:${(r.m2/max*100).toFixed(1)}%"></i></div><div class="v">${owNum(Math.round(r.m2))} m²<small>${owPct(r.m2/M.total)} · ${owPar(r.c)}</small></div></div>`).join('');
  box.querySelectorAll('.owbar').forEach((el,i)=>{const r=rows[i];
    const go=()=>{ if(owSel&&owSel.label===r.key&&owSel.kind===owView){owSelect(null);return;} owSelectSheets(r.key,r.pls,owView); owSel.m2=r.m2; owPanel();
      if(innerWidth<900) document.getElementById('owmap').scrollIntoView({behavior:'smooth',block:'center'}); };
    el.addEventListener('click',go); el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});});

/* ---- sizes and fragmentation ---- */
function owSizes(){
  const a=OWM.P.map(p=>p.m2).sort((x,y)=>x-y), n=a.length, med=n%2?a[(n-1)/2]:(a[n/2-1]+a[n/2])/2;
  document.getElementById('owsizekpi').innerHTML=[[a[0],'own.s.min'],[med,'own.s.med'],[Math.round(OWM.total/n),'own.s.mean'],[a[n-1],'own.s.max']]
    .map(([v,k])=>`<div><div class="n">${owNum(v)}</div><div class="l">${tt(k)}</div></div>`).join('');
  const B=[[0,250,'< 250 m²'],[250,500,'250–499 m²'],[500,1000,'500–999 m²'],[1000,2000,'1 000–1 999 m²'],[2000,1e9,'≥ 2 000 m²']];
  const bins=B.map(([lo,hi,l])=>{const ps=OWM.P.filter(p=>p.m2>=lo&&p.m2<hi);return {l,c:ps.length,m:ps.reduce((s,p)=>s+p.m2,0)};});
  const mx=Math.max(...bins.map(b=>b.c));
  document.getElementById('owbins').innerHTML=bins.map(b=>`<div class="owbar st"><div class="nm">${b.l}</div><div class="tr"><i style="width:${(b.c/mx*100).toFixed(1)}%"></i></div><div class="v">${owPar(b.c)}<small>${owNum(b.m)} m² · ${owPct(b.m/OWM.total)}</small></div></div>`).join('');
  const ks=[...new Set(OWM.P.map(p=>p.k))].sort((x,y)=>x-y);
  const fr=ks.map(k=>{const ps=OWM.P.filter(p=>p.k===k);return {l:tt(k===1?'own.frag.k':'own.frag.ks',{k}),c:ps.length,m:ps.reduce((s,p)=>s+p.m2,0)};});
  const gp=OWM.P.filter(p=>p.gap>0); fr.push({l:tt('own.frag.gap'),c:gp.length,m:gp.reduce((s,p)=>s+p.m2,0),gap:1});
  const fx=Math.max(...fr.map(b=>b.c));
  document.getElementById('owfrag').innerHTML=fr.map(b=>`<div class="owbar st"><div class="nm">${b.l}</div><div class="tr"><i class="${b.gap?'unk':''}" style="width:${(b.c/fx*100).toFixed(1)}%"></i></div><div class="v">${owPar(b.c)}<small>${owNum(b.m)} m² · ${owPct(b.m/OWM.total)}</small></div></div>`).join('');
}

/* ---- purchase plan ---- */
function owNotes(s){
  const n=[];
  const ab=s.persons.filter(x=>/SAD|Australija/.test(x.note)); if(ab.length) n.push(tt('own.n.abroad',{w:ab.map(x=>x.note.replace('SAD',L('USA','SAD')).replace('Australija',L('Australia','Australija'))).join(', ')}));
  if(s.persons.some(x=>/izvanknji/.test(x.note))) n.push(tt('own.n.off'));
  if(s.persons.some(x=>x.a==null)) n.push(tt('own.n.unk'));
  if(s.persons.length>1) n.push(tt('own.n.many',{p:s.persons.length}));
  const co=new Set(); s.parcels.forEach(id=>OWM.P.find(p=>p.id===id).h.forEach(([pl])=>{if(pl!==s.pl)co.add('PL '+pl);}));
  if(co.size) n.push(tt('own.n.shared',{w:[...co].join(', ')}));
  return n;
}
function owPlan(){
  let cum=0;
  document.getElementById('owplan').innerHTML=`<thead><tr><th class="r">${tt('own.c.rank')}</th><th>${tt('own.c.sheet')}</th><th>${tt('own.c.holders')}</th><th class="r">${tt('own.c.parcels')}</th><th class="r">${tt('own.c.m2')}</th><th class="r">${tt('own.c.pct')}</th><th class="r">${tt('own.c.cum')}</th><th>${tt('own.c.notes')}</th></tr></thead><tbody>`+
    OWM.S.map((s,i)=>{cum+=s.m2;return `<tr><td class="r">${i+1}</td><td style="white-space:nowrap">PL ${s.pl}</td><td>${owSheetWho(s,true)}</td><td class="r">${s.parcels.length}</td><td class="r">${owNum(s.m2)}</td><td class="r">${owPct(s.m2/OWM.total)}</td><td class="r">${owPct(cum/OWM.total)}</td><td><span class="x">${owNotes(s).map(owEsc).join('<br>')}</span></td></tr>`;}).join('')+'</tbody>';
  document.getElementById('owsteps').innerHTML=tt('own.steps').map(([k,v])=>`<li><b>${k}</b><span>${owEsc(v.replace('{pld}',owD(OWN.pldate)).replace('{g}',owNum(OWM.gap)).replace('{mu}',owNum(OWM.mun/1e4,2)))}</span></li>`).join('');
}

/* ---- register ---- */
function owReg(){
  const q=owQ.trim().toLowerCase();
  const rows=OWM.P.filter(p=>!q||p.id.includes(q)||p.h.some(([pl])=>('pl '+pl).includes(q)||OWM.sheets[pl].persons.some(x=>x.n.toLowerCase().includes(q))));
  const k=owSort.k,d=owSort.d;
  rows.sort((a,b)=>d*(k==='m2'?a.m2-b.m2:k==='k'?a.k-b.k:owIdCmp(a.id,b.id)));
  const ar=c=>owSort.k===c?(owSort.d>0?' ↑':' ↓'):'';
  const tb=document.getElementById('owreg');
  tb.innerHTML=`<thead><tr><th data-k="id">${tt('own.c.parcel')}${ar('id')}</th><th class="r" data-k="m2">${tt('own.c.m2')}${ar('m2')}</th><th>${tt('own.c.status')}</th><th data-k="k">${tt('own.c.holders')}${ar('k')}</th><th class="r">${tt('own.c.cover')}</th></tr></thead><tbody>`+
    rows.map(p=>`<tr data-id="${p.id}"><td style="white-space:nowrap">${p.id}</td><td class="r">${owNum(p.m2)}</td><td><span class="x">${tt('own.status.'+p.s)}</span></td><td>`+
      p.h.map(([pl,m])=>`<span class="x">PL ${pl} · ${owNum(m)} m²</span>${owSheetWho(OWM.sheets[pl],true)}`).join('<br>')+
      `</td><td class="r">${owPct(Math.min(1,(p.m2-p.gap)/p.m2))}</td></tr>`).join('')+
    OWN.mun.filter(()=>!q||'općina kukljica'.includes(q)||'opcina'.includes(q)).map(([id,m2,cov])=>`<tr><td>${id}</td><td class="r">${owNum(m2)}</td><td><span class="x">${tt('own.status.mu')}</span></td><td><span class="x">PL 657</span>Općina Kukljica 1/1</td><td class="r">${owPct(cov/m2)}</td></tr>`).join('')+'</tbody>';
  tb.querySelectorAll('th[data-k]').forEach(th=>th.addEventListener('click',()=>{const c=th.dataset.k;owSort=owSort.k===c?{k:c,d:-owSort.d}:{k:c,d:c==='id'?1:-1};owReg();owPaintSel();}));
  tb.querySelectorAll('tr[data-id]').forEach(tr=>tr.addEventListener('click',()=>{const p=OWM.P.find(x=>x.id===tr.dataset.id);owSelect({kind:'parcel',parcel:p,pls:new Set(p.h.map(x=>x[0])),parcels:new Set([p.id])});}));
  owPaintSel();
}
function owCSV(){
  const head=['parcel','parcel_m2','status','sheet','sheet_share_m2','holder','fraction','note','person_m2_estimate'];
  const out=[head];
  OWM.P.slice().sort((a,b)=>owIdCmp(a.id,b.id)).forEach(p=>{
    p.h.forEach(([pl,m])=>OWM.sheets[pl].persons.forEach(x=>out.push([p.id,p.m2,p.s,'PL '+pl,m,x.n,x.a!=null?x.a+'/'+x.b:'',x.note,x.a!=null?Math.round(m*x.a/x.b):''])));
    if(p.gap>0) out.push([p.id,p.m2,p.s,'',p.gap,'(not covered by an attached sheet)','','','']);
  });
  OWN.mun.forEach(([id,m2,cov])=>out.push([id,m2,'municipal','PL 657',cov,'Općina Kukljica','1/1','','']));
  const csv='﻿'+out.map(r=>r.map(v=>{v=String(v);return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='kukljica-ecooasis-owners.csv'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
document.getElementById('owq').addEventListener('input',e=>{owQ=e.target.value;owReg();});
document.getElementById('owcsv').addEventListener('click',owCSV);
document.getElementById('owclear').addEventListener('click',()=>owSelect(null));

ring(); apply();
</script>
