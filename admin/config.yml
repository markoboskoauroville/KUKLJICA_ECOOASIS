      - name: calendar
        label: "Kalendar"
        file: content/simple/calendar.json
        fields:
          - { name: _label, label: Naziv sekcije, widget: hidden, default: "Kalendar" }
          - name: fields
            label: Tekstovi
            widget: list
            summary: "{{fields.key}} — {{fields.hr}}"
            fields:
              - { name: key, label: Šifra (ne dirati), widget: string }
